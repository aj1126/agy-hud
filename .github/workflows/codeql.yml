name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 22 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Skip legacy advanced CodeQL workflow
      run: |
        echo "Repository uses GitHub Code Scanning Default Setup."
        echo "Legacy advanced CodeQL workflow is kept only to satisfy existing required check names."
